name: atualizar contribuicoes

on:
  # roda todo dia as 09:23 UTC (06:23 no horario de brasilia)
  schedule:
    - cron: '23 9 * * *'
  # cria o botao "Run workflow" para rodar na mao
  workflow_dispatch:

# deixa o robo fazer commit no repositorio
permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      # baixa o codigo do repositorio para a maquina do robo
      - uses: actions/checkout@v5

      # roda o script com o token guardado no secret
      - name: rodar o script
        run: node scripts/contribuicoes.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # faz commit do json so se ele mudou
      - name: salvar o arquivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribuicoes.json
          git diff --staged --quiet || (git commit -m "atualiza contribuicoes" && git push)